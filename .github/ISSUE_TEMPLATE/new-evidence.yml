name: New evidence
description: Submit a public source that may change a bounded case state.
title: "evidence: "
labels: ["evidence"]
body:
  - type: input
    id: case
    attributes: {label: Case, description: Case ID or canonical case URL}
    validations: {required: true}
  - type: input
    id: claim
    attributes: {label: Claim affected, description: The exact bounded claim this source bears on}
    validations: {required: true}
  - type: input
    id: url
    attributes: {label: Source URL, description: Public and directly accessible where possible}
    validations: {required: true}
  - type: input
    id: date
    attributes: {label: Source date, description: Use YYYY-MM-DD or explain why unknown}
    validations: {required: true}
  - type: textarea
    id: description
    attributes: {label: Evidence description, description: What does the source directly report?}
    validations: {required: true}
  - type: textarea
    id: change
    attributes: {label: Why it may change the state, description: State the narrow transition you believe it supports}
    validations: {required: true}
  - type: textarea
    id: limits
    attributes: {label: Known limitations, description: What does the source not establish?}
    validations: {required: true}
  - type: textarea
    id: relationship
    attributes: {label: Relationship to source, description: Disclose whether you authored, funded, operate, sell, or are otherwise connected to it}
    validations: {required: true}
