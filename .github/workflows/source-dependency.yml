name: Source dependency protocol

on:
  pull_request:
    paths:
      - '.github/workflows/source-dependency.yml'
      - 'protocol/source-dependency/**'
      - 'scripts/source_dependency_v01.py'
      - 'scripts/test_source_dependency_v01.py'
      - 'scripts/build_source_dependency_view_phase_b.py'
      - 'scripts/test_source_dependency_view_phase_b.py'
      - 'scripts/templates/source-dependency-section-v0.1.html'
      - 'cases/800vdc/source-dependency-v0.1.json'
      - 'cases/800vdc/source-dependency/**'
      - 'docs/cases/800vdc/source-dependency-v0.1.json'
      - 'docs/cases/800vdc/source-dependency/**'
      - 'assets/source-dependency.css'
      - 'docs/assets/source-dependency.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source dependency regression and abuse cases
        run: python -B scripts/test_source_dependency_v01.py
      - name: Grounded 800VDC source dependency view
        run: |
          python -B scripts/build_source_dependency_view_phase_b.py
          python -B scripts/test_source_dependency_view_phase_b.py
      - name: Parse versioned protocol records
        run: |
          python -m json.tool protocol/source-dependency/schema-v0.1.json >/dev/null
          python -m json.tool protocol/source-dependency/qualification-rules-v0.1.json >/dev/null
          python -m json.tool protocol/source-dependency/qualification-rules-v0.2.json >/dev/null
          python -m json.tool protocol/source-dependency/registry-v0.1.json >/dev/null
      - name: Whitespace safety
        run: git diff --check
