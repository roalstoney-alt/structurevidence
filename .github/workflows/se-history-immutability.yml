name: SE historical record immutability
on:
  pull_request:
permissions:
  contents: read
jobs:
  history-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_history_immutability
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/guard_history_immutability.py --base "$BASE_SHA"
