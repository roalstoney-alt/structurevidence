name: Case review freshness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-review-freshness.yml'
      - 'scripts/export_case_review_status.py'
      - 'scripts/test_case_review_status.py'
      - 'scripts/validate_case_watch.py'
      - 'scripts/test_case_watch.py'
      - 'data/case-watch/**'
      - 'cases/index.html'
      - 'cases/review-status.json'
      - 'cases/**/index.json'
      - 'cases/**/search-review-*.json'
  pull_request:
    paths:
      - '.github/workflows/case-review-freshness.yml'
      - 'scripts/export_case_review_status.py'
      - 'scripts/test_case_review_status.py'
      - 'data/case-watch/**'
      - 'cases/index.html'
      - 'cases/review-status.json'
      - 'cases/**/index.json'
      - 'cases/**/search-review-*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-review-clocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified tag
        with:
          python-version: '3.12'
      - name: Install the existing schema validator dependency
        run: python -m pip install jsonschema==4.25.1
      - name: Review clocks and frozen case-watch controls
        run: |
          python scripts/test_case_review_status.py
          python scripts/test_case_watch.py
          python scripts/test_irkutsk_publication.py
          python scripts/test_irkutsk_alias_repair.py
      - name: Deterministic index and review status
        run: |
          python scripts/export_case_review_status.py
          git diff --exit-code -- cases/index.html docs/cases/index.html cases/review-status.json docs/cases/review-status.json
