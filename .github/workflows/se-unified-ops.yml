name: StructEvidence unified operations executor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live-x-test]
      date_sgt:
        description: Scheduled Asia/Singapore date (YYYY-MM-DD)
        required: true

concurrency:
  group: se-unified-ops-${{ inputs.date_sgt }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest scripts.test_se_unified_ops
      - name: Execute bounded workflow
        env:
          X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
          X_EXPECTED_HANDLE: structevidence
        run: python scripts/se_unified_ops.py --mode "${{ inputs.mode }}" --date "${{ inputs.date_sgt }}"
